<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>곱셈구구 ✖️ — 수학 놀이터</title>
  <link rel="stylesheet" href="../../css/style.css" />

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<!-- ── 배경 별 ─────────────────────────────── -->
<div id="starsBg"></div>

<!-- ══════════════════════════════════════════
     게임 화면
══════════════════════════════════════════════ -->
<div id="gameScreen" class="game-screen hidden">

  <!-- 게임 헤더 -->
  <div class="game-header">
    <!-- 제목 -->
    <div class="game-title">✖️ 곱셈구구</div>

    <!-- 타이머 링 -->
    <div class="timer-ring">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <!-- 배경 링 -->
        <circle cx="28" cy="28" r="22"
          fill="none"
          stroke="rgba(255,255,255,.1)"
          stroke-width="4"/>
        <!-- 진행 링 -->
        <circle id="timerCircle" cx="28" cy="28" r="22"
          fill="none"
          stroke="var(--cyan)"
          stroke-width="4"
          stroke-linecap="round"
          style="transition: stroke-dashoffset .05s linear, stroke .3s; stroke-dasharray: 138.2; stroke-dashoffset: 0;"/>
      </svg>
      <span class="timer-num" id="timerNum">10</span>
    </div>

    <!-- 점수 -->
    <div class="score-display">
      <div class="score-label">점수</div>
      <div class="score-value" id="scoreValue">0</div>
    </div>
  </div>

  <!-- 게임 본문 -->
  <div class="game-main">

    <!-- 라이브 보드 (멀티 전용, 기본 hidden) -->
    <div id="liveBoardWrapper" class="live-board hidden">
      <div class="live-board-title">🏆 실시간 순위</div>
      <div id="liveBoardRows"><!-- JS 렌더 --></div>
    </div>

    <!-- 문제 카드 -->
    <div class="question-card">
      <div class="question-text" id="questionText">
        <span>?</span> × <span>?</span> = ?
      </div>
    </div>

    <!-- 피드백 텍스트 -->
    <div class="feedback" id="feedback"></div>

    <!-- 답 입력 -->
    <div class="answer-area">
      <input
        type="number"
        id="answerInput"
        class="answer-input"
        placeholder="?"
        min="1"
        max="81"
        autocomplete="off"
        inputmode="numeric"
        oninput="onAnswerInput(event)"
        onkeydown="onAnswerKeydown(event)"
      />
    </div>

    <p style="color:var(--text-dim);font-size:.82rem;text-align:center;">
      답을 입력하고 <kbd style="background:rgba(255,255,255,.1);padding:2px 8px;border-radius:4px;">Enter</kbd> 또는 자동 확인
    </p>

  </div><!-- /game-main -->
</div><!-- /gameScreen -->

<!-- ══════════════════════════════════════════
     결과 화면
══════════════════════════════════════════════ -->
<div id="resultScreen" class="result-screen hidden">
  <div class="result-card">

    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title" id="resultTitle">게임 종료!</div>

    <div class="result-score" id="resultScore">0</div>
    <div class="result-label" id="resultLabel">문제 정답!</div>

    <div class="result-extra hidden" id="resultExtra"></div>

    <!-- 멀티 결과 테이블 (멀티 전용) -->
    <div id="multiResultSection" class="hidden" style="margin-bottom:16px;">
      <table class="multi-result-table">
        <thead>
          <tr>
            <th>순위</th>
            <th>닉네임</th>
            <th>점수</th>
          </tr>
        </thead>
        <tbody id="multiResultBody"></tbody>
      </table>
    </div>

    <div class="result-actions">
      <button onclick="playAgain()" class="btn btn-primary">🔄 다시 하기</button>
      <button onclick="goLobby()"   class="btn btn-ghost">🏠 로비로</button>
    </div>

  </div>
</div><!-- /resultScreen -->

<!-- ── Scripts ───────────────────────────── -->
<script src="../../js/firebase-config.js"></script>
<script src="../../js/game-registry.js"></script>
<script src="../../js/multiplayer.js"></script>
<script src="game.js"></script>

</body>
</html>
