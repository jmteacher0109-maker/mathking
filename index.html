<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>수학 놀이터 🧮</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Firebase SDK (compat v10) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>

<!-- ── 배경 별 ─────────────────────────────── -->
<div id="starsBg"></div>

<!-- ══════════════════════════════════════════
     로그인 화면
══════════════════════════════════════════════ -->
<div id="loginScreen" class="screen">
  <div class="login-screen-wrapper">
    <div class="login-box">
      <div class="login-logo">🧮</div>
      <h1 class="login-title">수학 놀이터</h1>
      <p class="login-subtitle">수학으로 즐기는 두뇌 스포츠!</p>

      <input
        type="text"
        id="usernameInput"
        placeholder="닉네임 입력 (2~10자)"
        maxlength="10"
        class="input-field"
        autocomplete="off"
      />
      <button onclick="handleLogin()" class="btn btn-primary btn-large btn-full">
        입장하기 🚀
      </button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     메인 로비
══════════════════════════════════════════════ -->
<div id="mainLobby" class="screen hidden">

  <!-- 헤더 -->
  <header class="header">
    <div class="header-content">
      <div class="header-logo">🧮 수학 놀이터</div>
      <div class="header-user">
        <span class="user-badge" id="headerUsername"></span>
        <button onclick="handleLogout()" class="btn btn-ghost btn-sm">로그아웃</button>
      </div>
    </div>
  </header>

  <div class="container">

    <!-- 게임 선택 -->
    <section class="section">
      <h2 class="section-title">🎮 게임 선택</h2>
      <div class="games-grid" id="gamesGrid">
        <!-- JS로 렌더링 -->
      </div>
    </section>

    <!-- 랭킹 -->
    <section class="section">
      <h2 class="section-title">🏆 명예의 전당</h2>
      <div class="ranking-tabs" id="rankingTabs">
        <!-- JS로 렌더링 -->
      </div>
      <div class="ranking-table-wrapper">
        <table class="ranking-table">
          <thead>
            <tr>
              <th>순위</th>
              <th>닉네임</th>
              <th>최고점수</th>
            </tr>
          </thead>
          <tbody id="rankingBody">
            <tr><td colspan="3" class="loading-row">불러오는 중...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>
</div><!-- /mainLobby -->

<!-- ══════════════════════════════════════════
     멀티플레이 모달
══════════════════════════════════════════════ -->
<div id="multiModal" class="modal-overlay hidden">
  <div class="modal">
    <button onclick="closeMultiModal()" class="modal-close" title="닫기">✕</button>

    <h2 class="modal-title">👥 <span id="multiModalGameName"></span> — 멀티플레이</h2>

    <!-- ① 방식 선택 -->
    <div id="multiChoice" class="multi-screen">
      <p class="modal-desc">같이 플레이할 방식을 선택하세요</p>
      <div class="multi-buttons">
        <button onclick="showCreateRoom()" class="btn btn-accent btn-large multi-btn">
          <span class="btn-icon">🏠</span>
          방 만들기
          <span class="btn-desc">코드를 생성해 친구를 초대</span>
        </button>
        <button onclick="showJoinRoom()" class="btn btn-secondary btn-large multi-btn">
          <span class="btn-icon">🚪</span>
          방 참가하기
          <span class="btn-desc">초대 코드로 방 입장</span>
        </button>
      </div>
    </div>

    <!-- ② 방 만들기 대기 (호스트) -->
    <div id="createRoomScreen" class="multi-screen hidden">
      <div class="room-code-display">
        <p class="room-code-label">📋 초대 코드</p>
        <div class="room-code" id="roomCodeDisplay">------</div>
        <button onclick="copyRoomCode()" class="btn btn-ghost btn-sm">📋 코드 복사</button>
      </div>

      <div class="waiting-room">
        <h3>대기 중인 플레이어</h3>
        <div class="players-list" id="waitingPlayers"></div>
      </div>

      <button onclick="startMultiGame()" id="startGameBtn" class="btn btn-large btn-full" disabled>
        게임 시작 (최소 2명 필요)
      </button>
    </div>

    <!-- ③ 방 참가하기 -->
    <div id="joinRoomScreen" class="multi-screen hidden">
      <p class="modal-desc">친구에게 받은 6자리 코드를 입력하세요</p>
      <input
        type="text"
        id="roomCodeInput"
        placeholder="A B C 1 2 3"
        maxlength="6"
        class="input-field code-input"
        autocomplete="off"
        oninput="this.value=this.value.toUpperCase()"
      />
      <button onclick="joinRoom()" class="btn btn-primary btn-full">참가하기 →</button>
      <div id="joinError" class="error-msg hidden"></div>
    </div>

    <!-- ④ 대기 중 (게스트) -->
    <div id="guestWaitScreen" class="multi-screen hidden">
      <div class="room-code-display">
        <p class="room-code-label">참가한 방 코드</p>
        <div class="room-code" id="guestRoomCode">------</div>
      </div>

      <div class="waiting-room">
        <h3>대기 중인 플레이어</h3>
        <div class="players-list" id="guestWaitingPlayers"></div>
      </div>

      <div class="waiting-indicator">
        <div class="spinner"></div>
        <p>호스트가 게임을 시작할 때까지 대기 중...</p>
      </div>
    </div>

    <!-- ⑤ 카운트다운 -->
    <div id="countdownScreen" class="multi-screen hidden" style="text-align:center;padding:20px 0">
      <div class="countdown-display" id="countdownDisplay">3</div>
      <p class="countdown-sub" id="countdownSub">게임이 시작됩니다!</p>
    </div>

  </div>
</div>

<!-- ── Scripts ───────────────────────────── -->
<script src="firebase-config.js"></script>
<script src="game-registry.js"></script>
<script src="multiplayer.js"></script>
<script src="lobby.js"></script>

</body>
</html>
